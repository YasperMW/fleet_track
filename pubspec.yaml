name: fleet_track
description: "Fleet vehicle tracking app built with Flutter and FastAPI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
  image_path: "assets/icon/master_icon.png"
  adaptive_icon_background: "#0B1628"
  adaptive_icon_foreground: "assets/icon/master_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
